<!doctype html>
<html lang="en" data-astryx-theme="neutral">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VendorLens — is this vendor a real business, or a front?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.4.1/src/reset.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.4.1/dist/astryx.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.4.1/dist/theme.css" />
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.0",
    "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.0",
    "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
    "@astryxdesign/core": "https://esm.sh/@astryxdesign/core@0.4.1?external=react,react-dom",
    "jev-web": "./jeveb/src/index.mjs",
    "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/dist/transformers.min.js",
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.mjs"
  }
}
</script>
<style>
  body { font-family: var(--font-family-body); background: var(--color-background-body, #f6f6f7); }
  .vl-wrap { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  .vl-brand { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.05rem; }
  .vl-dot { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--color-blue-vivid, #2a7de1), var(--color-violet-vivid, #7a4de1)); }
  .vl-hero h1 { margin: .2rem 0 .4rem; }
  .vl-diff { margin-top: .7rem; padding: .7rem .95rem;
    border-left: 3px solid var(--color-blue-vivid, #2a7de1);
    background: var(--color-background-surface, #fff);
    border-radius: 0 10px 10px 0; }
  .vl-search { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
  .vl-input { flex: 1 1 360px; min-width: 240px; padding: .7rem .9rem; font: inherit;
    border: 1px solid var(--color-border, #d7d7db); border-radius: var(--radius-container, 12px);
    background: var(--color-background-surface, #fff); }
  .vl-gauge { display:flex; align-items:baseline; gap:.5rem; }
  .vl-score { font-size: 2.6rem; font-weight: 700; line-height: 1; }
  .vl-bar-track { height: 12px; border-radius: 999px; background: var(--color-background-elevated, #ececed); overflow: hidden; }
  .vl-bar-fill { height: 100%; border-radius: 999px; transition: width .5s ease; }
  .vl-obar { height: 12px; border-radius: 4px; background: var(--color-blue-vivid, #2a7de1); }
  .vl-obar-row { display: flex; align-items: center; gap: .5rem; margin: .3rem 0; }
  .vl-obar-lbl { width: 200px; text-align: right; font-size: .85rem; color: var(--color-text-secondary, #555); }
  .vl-obar-val { font-size: .8rem; color: var(--color-text-secondary, #555); width: 52px; }
  .vl-cite { color: var(--color-blue-vivid, #2a7de1); font-size: .72rem; vertical-align: super; text-decoration: none; }
  .vl-srcs a { color: var(--color-blue-vivid, #2a7de1); text-decoration: none; word-break: break-all; }
  .vl-mono { font-variant-numeric: tabular-nums; }
  .vl-row { display:flex; justify-content: space-between; gap:1rem; flex-wrap: wrap; }
  .vl-tag { font-size: .75rem; color: var(--color-text-secondary, #666); }
  .vl-divider { border-top: 1px solid var(--color-border, #e6e6e8); margin: .4rem 0; }
  .vl-spin { display:inline-block; width:16px; height:16px; border:2px solid var(--color-border,#ccc); border-top-color: var(--color-blue-vivid,#2a7de1); border-radius:50%; animation: vlspin .8s linear infinite; vertical-align:-3px; margin-right:.5rem;}
  @keyframes vlspin { to { transform: rotate(360deg); } }
  .vl-btn { font: inherit; padding: .7rem 1.2rem; font-weight: 600; color: #fff; cursor: pointer;
    background: var(--color-blue-vivid, #2a7de1); border: none; border-radius: var(--radius-inner, 10px); }
  .vl-btn:disabled { opacity: .6; cursor: default; }
  .vl-btn.ghost { background: transparent; color: var(--color-blue-vivid, #2a7de1); border: 1px solid var(--color-border, #d7d7db); }
  .vl-foot { margin-top: 2rem; }
</style>
</head>
<body>
<div class="vl-wrap" id="root"></div>
<script type="module">
import * as React from 'react';
import { createRoot } from 'react-dom/client';
import { Card, Stack, Heading, Text, Badge } from '@astryxdesign/core';

const AGENT_API = "__AGENT_API__";
const AGENT_KEY = "__AGENT_KEY__";

const e = React.createElement;
// When the page is built without an agent gateway (AGENT_API left as the
// placeholder), Investigate runs a built-in canned investigation result,
// captured from a real `python -m vendorlens acme-cloud-services.example
// --demo` run (run 21199f99, see runs/ in the repo). The public page then
// has zero backend: the verdict renders and the on-device jev-web model
// scores the homepage text entirely in the browser.
const AGENT_CONNECTED = !/^__.*__$/.test(AGENT_API);
const CANNED_VERDICT = {
  ok: true, input: 'acme-cloud-services.example', domain: 'acme-cloud-services.example',
  resolved_from: null, mode: 'demo', run_id: '21199f99',
  verdict: {
    score: 48, band: 'MEDIUM',
    headline: 'MEDIUM risk',
    summary: 'urlscan.io holds 2 of 3 scan verdict(s) marked malicious (phishing); 2 negative report(s) found in web search. (discounted: corroborating registry, certificate and firmographic evidence outweigh a keyword search hit)',
    retries: {}, signals_count: 5,
  },
  signals: [
    { signal: 'certificate_history', weight: -6, detail: '14 certificate(s) in transparency logs covering 4 name(s).', sources: ['demo: canned crt.sh response'] },
    { signal: 'certificate_history_long', weight: -8, detail: 'Certificates publicly logged since 2022 (more than three years of continuity).', sources: ['demo: canned crt.sh response'] },
    { signal: 'urlscan_malicious', weight: 40, detail: 'urlscan.io holds 2 of 3 scan verdict(s) marked malicious (phishing).', sources: ['demo: canned urlscan response'] },
    { signal: 'scam_phrases', weight: 10, detail: 'Homepage contains high-risk phrases: wire transfer, ends tonight, limited offer, telegram @, no company registration. (discounted: corroborating registry, certificate and firmographic evidence outweigh a keyword search hit)', sources: ['demo: canned homepage'] },
    { signal: 'negative_reports', weight: 12, detail: '2 negative report(s) found in web search. (discounted: corroborating registry, certificate and firmographic evidence outweigh a keyword search hit)', sources: ['https://example-forum.example/t/12345', 'https://example-reviews.example/acme'] },
  ],
  sources: ['demo: canned crt.sh response', 'demo: canned homepage', 'demo: canned urlscan response', 'https://example-forum.example/t/12345', 'https://example-reviews.example/acme'],
  tools: [
    { name: 'rdap_lookup', ok: true, error: null },
    { name: 'doh_dns', ok: true, error: null },
    { name: 'tls_inspect', ok: true, error: null },
    { name: 'ct_logs', ok: true, error: null },
    { name: 'urlscan_reputation', ok: true, error: null },
    { name: 'phishtank_check', ok: true, error: null },
    { name: 'fetch_homepage', ok: true, error: null },
    { name: 'web_search_reports', ok: true, error: null },
    { name: 'crustdata_enrich', ok: true, error: null },
  ],
  homepage_text: "Acme Cloud Services - Cut your cloud bill by 90% overnight!\nLimited offer ends tonight. No company registration number listed.\nContact us on Telegram @acmeclouddeals. Wire transfer only.\nOur revolutionary AI does everything, trusted by thousands (reviews coming soon).",
  brief_md: '',
};
const QUESTIONS = [
  { type: 'noul', instructions: 'This text shows signs of a scam operation.' },
  { type: 'score', instructions: 'How trustworthy does this vendor appear?',
    options: ['very untrustworthy', 'untrustworthy', 'neutral', 'trustworthy', 'very trustworthy'] },
  { type: 'choice', instructions: 'What is the dominant risk signal in this text?',
    options: ['none visible', 'pressure tactics', 'too-good-to-be-true pricing',
              'vague company identity', 'suspicious payment request'] },
];

const BAND_COLOR = { LOW: 'success', MEDIUM: 'warning', HIGH: 'error', CRITICAL: 'error' };
const BAND_VAR = { LOW: 'var(--color-success, #2e9e5b)', MEDIUM: 'var(--color-warning, #d99a00)',
  HIGH: 'var(--color-error, #d23a3a)', CRITICAL: 'var(--color-error, #a10f0f)' };

let _decider = null, _loading = null;
async function getDecider(onProgress) {
  if (_decider) return _decider;
  if (!_loading) {
    const { createBekkoDecider } = await import('jev-web');
    _loading = createBekkoDecider({
      wasmPaths: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
      onProgress,
    }).then((d) => { _decider = d; return d; })
        .catch((err) => { _loading = null; throw err; });
  }
  return _loading;
}

function Bar({ p, color }) {
  return e('div', { className: 'vl-obar-row' },
    e('div', { style: { flex: '1' } },
      e('div', { className: 'vl-bar-track' },
        e('div', { className: 'vl-bar-fill', style: { width: Math.round(p * 100) + '%', background: color || 'var(--color-blue-vivid, #2a7de1)' } }))));
}

function AnswerBlock({ q, a }) {
  const probs = a.probabilities || {};
  const entries = Object.entries(probs).sort((x, y) => y[1] - x[1]);
  let answer;
  if (a.type === 'noul') answer = (a.noul > 0.5 ? 'yes' : 'no');
  else if (a.type === 'score') answer = a.level + ' (' + (a.probabilities ? '' : '') + ')';
  else answer = a.choice;
  return e('div', { className: 'vl-divider' },
    e(Text, null, q.instructions),
    e('div', { style: { margin: '.35rem 0' } },
      entries.map(([label, p]) => e('div', { key: label, className: 'vl-obar-row' },
        e('span', { className: 'vl-obar-lbl' }, label),
        e('div', { style: { flex: '1' } },
          e('div', { className: 'vl-bar-track' },
            e('div', { className: 'vl-bar-fill', style: { width: Math.round(p * 100) + '%' } }))),
        e('span', { className: 'vl-obar-val vl-mono' }, (p * 100).toFixed(1) + '%')))),
    e('div', { className: 'vl-tag' }, 'model answer: ' + answer + ' · confidence ' + (a.confidence * 100).toFixed(1) + '%'));
}

function SignalRow({ s, idx }) {
  const cites = (s.sources || []).map((src) => (idx[src] !== undefined ? idx[src] + 1 : null))
    .filter(Boolean);
  return e('div', { className: 'vl-divider' },
    e('div', { className: 'vl-row' },
      e('strong', null, s.signal.replace(/_/g, ' ')),
      e('span', { className: 'vl-mono', style: { fontWeight: 600,
        color: s.weight >= 0 ? 'var(--color-error,#d23a3a)' : 'var(--color-success,#2e9e5b)' } },
        (s.weight > 0 ? '+' : '') + s.weight)),
    e(Text, null, s.detail),
    cites.length ? e('span', { style: { fontSize: '.78rem' } },
      cites.map((n) => e('a', { key: n, className: 'vl-cite', href: '#src-' + n }, '[' + n + ']'))) : null);
}

function App() {
  const [input, setInput] = React.useState('');
  const [mode, setMode] = React.useState('demo');
  const [loading, setLoading] = React.useState(false);
  const [result, setResult] = React.useState(null);
  const [error, setError] = React.useState('');
  const [expanded, setExpanded] = React.useState(false);
  const [odel, setModel] = React.useState({ status: 'idle', answers: null, ms: 0, model: '' });

  async function investigate() {
    const q = input.trim();
    if (!q) { setError('Enter a company name or domain.'); return; }
    setLoading(true); setError(''); setResult(null); setExpanded(false);
    setModel({ status: 'idle', answers: null, ms: 0, model: '' });
    if (!AGENT_CONNECTED) {
      // No agent gateway baked into this build: replay the canned run so the
      // public page always demonstrates the full flow, including the
      // on-device verdict model.
      await new Promise((r) => setTimeout(r, 350));
      setResult({ ...CANNED_VERDICT, input: q || CANNED_VERDICT.input,
        mode: 'demo',
        resolved_from: null });
      setLoading(false);
      return;
    }
    try {
      const r = await fetch(AGENT_API + '?q=' + encodeURIComponent(q) + '&mode=' + mode,
                            { headers: { 'x-api-key': AGENT_KEY } });
      const d = await r.json().catch(() => ({}));
      if (!d.ok) { setError(d.error || ('Error ' + r.status)); return; }
      setResult(d);
    } catch (err) {
      setError('Request failed: ' + (err && err.message ? err.message : err));
    } finally { setLoading(false); }
  }

  React.useEffect(() => {
    if (!result || !result.homepage_text) { setModel({ status: 'idle', answers: null, ms: 0, model: '' }); return; }
    let cancelled = false;
    setModel({ status: 'loading', answers: null, ms: 0, model: '' });
    (async () => {
      try {
        const d = await getDecider();
        const t0 = performance.now();
        const { answers, timings } = await d.decide(result.homepage_text, QUESTIONS);
        if (cancelled) return;
        setModel({ status: 'ready', answers, ms: Math.round(performance.now() - t0),
          model: d.info.model, infer: Math.round((timings && timings.runMs) || 0) });
      } catch (err) {
        if (!cancelled) setModel({ status: 'error', err: String(err && err.message ? err.message : err), answers: null, ms: 0, model: '' });
      }
    })();
    return () => { cancelled = true; };
  }, [result]);

  const verdict = result && result.verdict;
  const srcIndex = {};
  if (result) (result.sources || []).forEach((s, i) => { srcIndex[s] = i; });

  const details = (result && expanded) ? e(Stack, { gap: 2, className: 'vl-foot' },
    e(Heading, { level: 4 }, 'Risk signals (' + result.signals.length + ')'),
    result.signals.length ? result.signals.map((s, i) => e(SignalRow, { key: i, s, idx: srcIndex }))
      : e(Text, { className: 'vl-tag' }, 'No significant signals.'),
    e('div', { className: 'vl-divider' }),
    e(Heading, { level: 4 }, 'Sources'),
    e('ol', { className: 'vl-srcs', style: { paddingLeft: '1.2rem', fontSize: '.82rem' } },
      result.sources.map((s, i) => e('li', { key: i, id: 'src-' + (i + 1) },
        /^https?:/.test(s) ? e('a', { href: s, target: '_blank', rel: 'noopener' }, s) : s))),
    e('div', { className: 'vl-divider' }),
    e(Heading, { level: 4 }, 'Tools executed'),
    result.tools.map((t) => e('div', { key: t.name, className: 'vl-row', style: { fontSize: '.85rem' } },
      e('span', null, (t.ok ? '\u2713 ' : '\u2717 ') + t.name),
      e('span', { className: 'vl-tag' }, t.ok ? 'ok' : (t.error || 'failed')))),
    verdict.retries && Object.keys(verdict.retries).length ? e(Text, { className: 'vl-tag' },
      'Retried with backoff: ' + Object.entries(verdict.retries).map((kv) => kv[0] + ' x' + kv[1]).join(', ')) : null
  ) : null;

  return e(Stack, { gap: 5 },
    e('div', { className: 'vl-brand' }, e('div', { className: 'vl-dot' }), 'VendorLens'),
    e('div', { className: 'vl-hero' },
      e(Heading, { level: 1 }, 'Is this counterparty a real, verifiable business, or a front?'),
      e(Text, null, 'VendorLens answers the question a phishing detector cannot. '
        + 'A URL checker tells you whether a page is malicious; it cannot tell you '
        + 'whether the company behind it exists. Enter a company name or domain and '
        + 'an OSINT agent checks registration data, DNS and mail infrastructure, TLS '
        + 'hygiene, certificate transparency history and subdomains, web-scan '
        + 'reputation, phishing blocklists, business records and independent reports, '
        + 'then reasons across them into a cited risk verdict.'),
      e('div', { className: 'vl-diff' },
        e('strong', null, 'This is counterparty due-diligence, not phishing detection.'),
        e(Text, { className: 'vl-tag', style: { marginTop: '.25rem' } },
          'It is the check you run before wiring money or sharing data with a vendor, '
          + 'on the legitimacy signals a URL classifier never sees. The verdict text is '
          + 'then scored on-device in your browser, so it never leaves the device.'))),

    e(Card, { elevation: 'low', padding: 5 },
      e('div', { className: 'vl-search' },
        e('input', { className: 'vl-input', value: input, placeholder: 'Company name or domain to verify (e.g. Acme Cloud or acme.com)',
          onChange: (ev) => setInput(ev.target.value),
          onKeyDown: (ev) => { if (ev.key === 'Enter') investigate(); }, id: 'q' }),
        e('select', { className: 'vl-input', style: { flex: '0 0 auto', minWidth: 'auto', width: 'auto' }, value: mode,
          onChange: (ev) => setMode(ev.target.value) },
          e('option', { value: 'demo' }, 'demo (canned)'),
          AGENT_CONNECTED ? e('option', { value: 'live' }, 'live') : null),
        e('button', { className: 'vl-btn', onClick: investigate, disabled: loading, id: 'go' },
          loading ? 'Investigating…' : 'Investigate'))),

    error ? e(Text, null, e('span', { style: { color: 'var(--color-error,#d23a3a)' } }, error)) : null,

    loading ? e(Text, { className: 'vl-tag' }, e('span', { className: 'vl-spin' }),
      AGENT_CONNECTED ? 'Running the agent across live sources…'
        : 'Running the agent across the sources…') : null,

    !AGENT_CONNECTED ? e(Text, { className: 'vl-tag', style: { marginTop: '.25rem' } },
      'Public build: the full OSINT agent runs locally (python -m vendorlens <domain>); '
      + 'this page replays a captured run and then scores it on-device below.') : null,

    verdict ? e(Card, { elevation: 'low', padding: 6 },
      e(Stack, { gap: 4 },
        result.resolved_from ? e(Text, { className: 'vl-tag' },
          'Resolved "' + result.input + '" → ' + result.domain) : null,
        e('div', { className: 'vl-row', style: { alignItems: 'center' } },
          e('div', null,
            e('div', { className: 'vl-gauge' },
              e('span', { className: 'vl-score vl-mono' }, String(verdict.score)),
              e('span', { style: { color: 'var(--color-text-secondary,#666)' } }, '/ 100')),
            e(Text, { className: 'vl-tag' }, result.domain + ' · run ' + result.run_id)),
          e(Badge, { color: BAND_COLOR[verdict.band] || 'neutral' }, verdict.band)),
        e('div', { className: 'vl-bar-track' },
          e('div', { className: 'vl-bar-fill', style: { width: verdict.score + '%', background: BAND_VAR[verdict.band] } })),
        e(Heading, { level: 3 }, verdict.headline),
        e(Text, null, verdict.summary),

        // on-device verdict model (auto-runs on the returned homepage text)
        e('div', { className: 'vl-divider' }),
        e('div', { className: 'vl-row' },
          e(Heading, { level: 4 }, 'On-device verdict'),
          e('span', { className: 'vl-tag' }, odel.status === 'ready'
            ? (odel.model + ' · ' + odel.ms + 'ms · zero network') : odel.status)),
        odel.status === 'loading' ? e(Text, { className: 'vl-tag' },
          e('span', { className: 'vl-spin' }), 'Loading on-device model (first run ~29MB)…') : null,
        odel.status === 'ready' && odel.answers ? e('div', null,
          odel.answers.map((a, i) => e(AnswerBlock, { key: i, q: QUESTIONS[i], a }))) : null,
        odel.status === 'skip' || (!result.homepage_text && odel.status === 'idle') ?
          e(Text, { className: 'vl-tag' }, 'No homepage text to score.') : null,

        // expandable investigation details
        e('div', { className: 'vl-divider' }),
        e('button', { className: 'vl-btn ghost', onClick: () => setExpanded(!expanded) },
          expanded ? 'Hide investigation details' : 'View investigation details'),
        details,
      )) : null);
}

createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
