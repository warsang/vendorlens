name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit + regression tests
        run: pytest -q
      - name: Demo run (canned, no keys)
        run: python -m vendorlens acme-cloud-services.example --demo --out /tmp/vl
      - name: Offline eval (cached runs)
        run: python -m vendorlens.eval
